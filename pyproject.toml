[project]
name = "ti-recon"
version = "0.1.0"
description = "External Threat Intelligence enrichment and analysis platform (foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    # IDNA/UTS-46 handling for internationalized domain normalization.
    "idna>=3.7",
    "vt-py>=0.22.0",
]

[project.scripts]
# The analyst entry point (Task 20). Stdlib argparse only: the CLI adds no
# dependency that every consumer of the library would then inherit.
ti-recon = "ti_recon.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    # Blocks the connection half of the test network boundary. The resolution
    # half is ours, in tests/fixtures/network.py, which explains why.
    "pytest-socket>=0.8,<0.9",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ti_recon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C4",   # comprehensions
    "DTZ",  # timezone-aware datetimes (a project invariant)
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
]
ignore = [
    "N818",  # error suffix on exception names; we use domain-specific names
]

[tool.ruff.lint.per-file-ignores]
# SIM300 flags `assert MODULE_CONSTANT == expected` as a Yoda condition.
"tests/**" = ["B011", "SIM300"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

# vt-py ships no type stubs and no py.typed marker. The override is scoped to
# that package so strict checking still applies to every line we write, and the
# GTI client wrapper is the only module that imports it.
[[tool.mypy.overrides]]
module = ["vt.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --disable-socket with --allow-hosts is pytest-socket's connection guard: every
# test runs with external connections refused and loopback intact. It is half the
# boundary — the resolution half lives in tests/fixtures/network.py, which
# documents why this plugin cannot provide it without also breaking loopback.
addopts = "-ra --strict-markers --strict-config --disable-socket --allow-hosts=127.0.0.1,::1"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ti_recon"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
